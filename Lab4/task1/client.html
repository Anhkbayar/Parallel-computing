<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chat</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: monospace; font-size: 14px; background: #fff; color: #000; display: grid; grid-template-rows: 40px 1fr 50px; grid-template-columns: 160px 1fr; height: 100vh; }

  /* Overlay */
  #overlay { position: fixed; inset: 0; background: #fff; display: flex; align-items: center; justify-content: center; z-index: 100; }
  #overlay.hidden { display: none; }
  #overlay-box { border: 1px solid #000; padding: 24px; width: 320px; }
  #overlay-box h1 { font-size: 18px; margin-bottom: 8px; }
  #overlay-box p { font-size: 12px; color: #555; margin-bottom: 16px; }
  #overlay-box label { display: block; font-size: 11px; font-weight: bold; margin-bottom: 4px; }
  #overlay-box input { width: 100%; border: 1px solid #000; padding: 6px 8px; font-family: monospace; font-size: 13px; margin-bottom: 10px; }
  #overlay-connect-btn { width: 100%; padding: 8px; background: #000; color: #fff; border: none; font-family: monospace; font-size: 14px; cursor: pointer; }
  #overlay-connect-btn:disabled { background: #888; cursor: default; }

  /* Header */
  header { grid-column: 1 / -1; border-bottom: 1px solid #000; display: flex; align-items: center; padding: 0 12px; gap: 12px; font-size: 13px; }
  header .logo { font-weight: bold; font-size: 14px; }
  header .spacer { flex: 1; }
  .badge { display: flex; align-items: center; gap: 4px; font-size: 11px; }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: #aaa; }
  .badge.up .dot { background: #22c55e; }
  .badge.down .dot { background: #ef4444; }

  /* Sidebar */
  aside { border-right: 1px solid #000; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .sidebar-label { font-size: 10px; font-weight: bold; text-transform: uppercase; color: #555; margin-bottom: 4px; }
  #identity-card { font-size: 11px; line-height: 1.8; }
  #identity-card .id-key { color: #555; width: 40px; display: inline-block; }
  #clients-list { font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
  .client-item { display: flex; align-items: center; gap: 6px; }
  .client-item.me { font-weight: bold; }

  /* Chat */
  #chat-area { padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .msg-row { display: flex; gap: 8px; max-width: 80%; }
  .msg-row.self { align-self: flex-end; flex-direction: row-reverse; }
  .msg-avatar { width: 24px; height: 24px; border-radius: 50%; background: #ddd; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; flex-shrink: 0; }
  .avatar-a { background: #bfdbfe; }
  .avatar-b { background: #bbf7d0; }
  .msg-content { display: flex; flex-direction: column; gap: 2px; }
  .msg-meta { font-size: 10px; color: #777; display: flex; align-items: center; gap: 6px; }
  .msg-meta .srv-tag { font-size: 9px; background: #eee; padding: 0 3px; border-radius: 2px; }
  .msg-bubble { background: #f3f4f6; border: 1px solid #e5e7eb; padding: 6px 10px; border-radius: 4px; font-size: 13px; word-break: break-word; }
  .msg-row.self .msg-bubble { background: #000; color: #fff; border-color: #000; }
  .sys-msg { font-size: 11px; color: #888; text-align: center; padding: 2px 0; }
  .sys-msg.err { color: #ef4444; }
  .sys-msg.warn { color: #f59e0b; }
  .sys-msg.ok { color: #22c55e; }

  /* Input */
  .input-bar { grid-column: 1 / -1; border-top: 1px solid #000; display: flex; align-items: center; padding: 6px 10px; gap: 8px; }
  .msg-input { flex: 1; border: 1px solid #ccc; padding: 6px 8px; font-family: monospace; font-size: 13px; resize: none; outline: none; }
  .msg-input:focus { border-color: #000; }
  .send-btn { background: #000; color: #fff; border: none; padding: 6px 14px; font-family: monospace; font-size: 13px; cursor: pointer; height: 100%; }
  .send-btn:disabled { background: #aaa; cursor: default; }
</style>
</head>
<body>

<!-- Connection overlay -->
<div id="overlay">
  <div id="overlay-box">
    <h1>CHAT</h1>
    <p>Connect to the distributed chat network via the load balancer.</p>
    <label>Balancer URL</label>
    <input id="balancer-url" type="text" value="http://localhost:8000" placeholder="http://localhost:8000" />
    <label>Your Client ID</label>
    <input id="overlay-client-id" type="number" placeholder="e.g. 2 (even→A) or 3 (odd→B)" min="1" />
    <button id="overlay-connect-btn" onclick="connectToBalancer()">Connect</button>
  </div>
</div>

<!-- Header -->
<header>
  <div class="logo">DISTCHAT</div>
  <div class="spacer"></div>
  <div class="badge unknown" id="badge-a"><span class="dot"></span> Server A</div>
  <div class="badge unknown" id="badge-b"><span class="dot"></span> Server B</div>
  <div class="badge unknown" id="badge-bal"><span class="dot"></span> Balancer</div>
</header>

<!-- Sidebar -->
<aside>
  <div>
    <div class="sidebar-label">Identity</div>
    <div id="identity-card">
      <div><span class="id-key">client</span> <span id="id-client">—</span></div>
      <div><span class="id-key">server</span> <span id="id-server">—</span></div>
      <div><span class="id-key">port</span> <span id="id-port">—</span></div>
    </div>
  </div>
  <div>
    <div class="sidebar-label">Online</div>
    <div id="clients-list"><span style="color:#aaa;font-size:11px;">No clients yet</span></div>
  </div>
</aside>

<!-- Chat -->
<div id="chat-area">
  <div class="sys-msg" id="empty-state">No messages yet</div>
</div>

<!-- Input -->
<div class="input-bar">
  <textarea class="msg-input" id="msg-input" placeholder="Type a message…" disabled rows="1"
    onkeydown="handleKey(event)"></textarea>
  <button class="send-btn" id="send-btn" onclick="sendMessage()" disabled>Send</button>
</div>

<script>
let socket = null;
let myClientId = null;
let myServer = null;
let myPort = null;

function createMsgId() {
  return `${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
}

function connectToBalancer() {
  const url = document.getElementById('balancer-url').value.trim() || 'http://localhost:8000';
  const clientId = document.getElementById('overlay-client-id').value.trim();
  if (!clientId) { document.getElementById('overlay-client-id').focus(); return; }

  myClientId = clientId;
  const btn = document.getElementById('overlay-connect-btn');
  btn.disabled = true;
  btn.textContent = 'Connecting…';

  socket = io(url, { reconnection: true, reconnectionAttempts: Infinity, reconnectionDelay: 2000 });

  socket.on('connect', () => {
    setBadge('bal', 'up');
    socket.emit('register_client', { clientId: myClientId });
  });

  socket.on('registered', (data) => {
    myClientId = data.clientId;
    myServer   = data.server;
    myPort     = data.port;

    document.getElementById('overlay').classList.add('hidden');
    document.getElementById('msg-input').disabled = false;
    document.getElementById('send-btn').disabled  = false;
    document.getElementById('msg-input').focus();

    document.getElementById('id-client').textContent = myClientId;
    document.getElementById('id-server').textContent = `Server ${myServer}`;
    document.getElementById('id-port').textContent   = myPort;

    sysMsg(`Connected as Client ${myClientId} → Server ${myServer}`, 'ok');
    if (data.note) sysMsg(data.note, 'warn');
    pollBackendHealth(url);
  });

  socket.on('message', appendMessage);

  socket.on('server_switched', (data) => {
    myServer = data.to;
    document.getElementById('id-server').textContent = `Server ${myServer}`;
    sysMsg(`Server switched: ${data.from} → ${data.to}${data.message ? ' — ' + data.message : ''}`, 'warn');
  });

  socket.on('all_servers_down', (data) => {
    sysMsg(data.message, 'err');
    document.getElementById('msg-input').disabled = true;
    document.getElementById('send-btn').disabled  = true;
  });

  socket.on('error_event', (data) => sysMsg(data.message, 'err'));

  socket.on('client_list', renderClientList);

  socket.on('disconnect', () => {
    setBadge('bal', 'down');
    sysMsg('Disconnected. Reconnecting…', 'warn');
    document.getElementById('msg-input').disabled = true;
    document.getElementById('send-btn').disabled  = true;
  });

  socket.on('reconnect', () => {
    setBadge('bal', 'up');
    sysMsg('Reconnected — re-registering…', 'ok');
    socket.emit('register_client', { clientId: myClientId });
    document.getElementById('msg-input').disabled = false;
    document.getElementById('send-btn').disabled  = false;
  });
}

function sendMessage() {
  const input = document.getElementById('msg-input');
  const text  = input.value.trim();
  if (!text || !socket) return;
  socket.emit('message', { messageId: createMsgId(), fromClientId: myClientId, text });
  input.value = '';
  input.style.height = 'auto';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function appendMessage(msg) {
  const chatArea = document.getElementById('chat-area');
  document.getElementById('empty-state')?.remove();

  const isSelf = msg.fromClientId === myClientId;
  const row = document.createElement('div');
  row.className = `msg-row ${isSelf ? 'self' : 'other'}`;

  const av = msg.originServer === 'A' ? 'avatar-a' : 'avatar-b';
  const initial = msg.fromClientId.toString()[0].toUpperCase();
  const time = new Date(msg.timestamp).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });

  row.innerHTML = `
    <div class="msg-avatar ${av}">${initial}</div>
    <div class="msg-content">
      <div class="msg-meta">
        <span>${isSelf ? 'You' : `Client ${msg.fromClientId}`}</span>
        <span class="srv-tag">${msg.originServer}</span>
        <span>${time}</span>
      </div>
      <div class="msg-bubble">${escHtml(msg.text)}</div>
    </div>`;

  chatArea.appendChild(row);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function sysMsg(text, type = '') {
  const chatArea = document.getElementById('chat-area');
  document.getElementById('empty-state')?.remove();
  const el = document.createElement('div');
  el.className = `sys-msg ${type}`;
  el.textContent = text;
  chatArea.appendChild(el);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function renderClientList(list) {
  const el = document.getElementById('clients-list');
  if (!list?.length) { el.innerHTML = '<span style="color:#aaa;font-size:11px;">No clients</span>'; return; }
  el.innerHTML = list.map(c => {
    const isMe = c.clientId === myClientId;
    const srv = (c.server || 'A').toUpperCase();
    return `<div class="client-item ${isMe ? 'me' : ''}">
      <span>${isMe ? `${c.clientId} (you)` : `Client ${c.clientId}`}</span>
      <span style="color:#888;font-size:10px;">${srv}</span>
    </div>`;
  }).join('');
}

function setBadge(which, state) {
  const el = document.getElementById(`badge-${which}`);
  if (el) el.className = `badge ${state}`;
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function pollBackendHealth(balancerUrl) {
  const base = balancerUrl.replace(/\/$/, '');
  async function poll() {
    try {
      const d = await (await fetch(`${base}/health`)).json();
      setBadge('a',   d.servers?.A ? 'up' : 'down');
      setBadge('b',   d.servers?.B ? 'up' : 'down');
      setBadge('bal', 'up');
    } catch { setBadge('bal', 'down'); }
  }
  poll();
  setInterval(poll, 6000);
}

document.getElementById('msg-input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});
</script>
</body>
</html>
